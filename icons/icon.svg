<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f72a9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#094a70;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#d4eefc;stop-opacity:0.7" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Background -->
  <rect width="128" height="128" rx="28" fill="url(#grad)" />
  
  <!-- Water Waves -->
  <path d="M 16 75 C 32 65, 48 85, 64 75 C 80 65, 96 85, 112 75 L 112 100 C 96 100, 80 100, 64 100 C 48 100, 32 100, 16 100 Z" fill="url(#waveGrad)" opacity="0.35"/>
  <path d="M 16 85 C 32 75, 48 95, 64 85 C 80 75, 96 95, 112 85 L 112 110 C 96 110, 80 110, 64 110 C 48 110, 32 110, 16 110 Z" fill="url(#waveGrad)" opacity="0.55"/>
  
  <!-- Telemetry Tower / Radar Pulse -->
  <circle cx="64" cy="40" r="12" fill="#ffffff" opacity="0.2"/>
  <circle cx="64" cy="40" r="22" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="4 2" opacity="0.6"/>
  <circle cx="64" cy="40" r="32" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.4"/>
  
  <!-- Pin / Drop / Sensor Icon -->
  <circle cx="64" cy="40" r="7" fill="#ffb703" />
  <circle cx="64" cy="40" r="3.5" fill="#ffffff" />
  
  <!-- Clock / 10-Min Timer Watch Emblem -->
  <g transform="translate(70, 70)">
    <circle cx="22" cy="22" r="20" fill="#ffffff" filter="drop-shadow(0px 2px 4px rgba(0,0,0,0.3))"/>
    <circle cx="22" cy="22" r="17" fill="#f8fafc" stroke="#e63946" stroke-width="2.5"/>
    <!-- 10 min wedge / sector -->
    <path d="M 22 22 L 22 8 A 14 14 0 0 1 34 14 Z" fill="#e63946" opacity="0.35" />
    <!-- Clock hands at 10 min -->
    <line x1="22" y1="22" x2="22" y2="10" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="22" y1="22" x2="33" y2="16" stroke="#e63946" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="22" cy="22" r="2.5" fill="#1e293b"/>
  </g>
</svg>